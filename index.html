<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allin Kausay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 900px;
            width: 90%;
            margin: 40px 0;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .drive-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 2px solid #f0f0f0;
            background: #fafafa;
            position: relative;
            padding-bottom: 56.25%; /* Aspect ratio 16:9 */
            height: 0;
        }

        .drive-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn {
            display: inline-block;
            margin-top: 35px;
            padding: 14px 35px;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.3);
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(17, 153, 142, 0.4);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Allin Kausay</h1>
        <p class="subtitle">El arte del buen vivir en armonía — Visualiza el contenido a continuación</p>
        
        <!-- Contenedor incrustado de la carpeta de Google Drive -->
        <div class="drive-container">
            <iframe src="https://drive.google.com/embeddedfolderview?id=1zC-sBWc5501zwOaL3TkqghMjiNFHIsBq#grid" allowfullscreen></iframe>
        </div>

        <a href="https://drive.google.com/drive/folders/1zC-sBWc5501zwOaL3TkqghMjiNFHIsBq?usp=sharing" target="_blank" class="btn">
            Ver directamente en Google Drive
        </a>
    </div>
</body>
</html>
